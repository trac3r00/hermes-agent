name: Secret scanning

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: [self-hosted, linux, x64, pve-ci]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan changed commits for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gitleaks-action downloads to os.tmpdir()/gitleaks.tmp; on a host
          # running several self-hosted runners /tmp is shared, so concurrent
          # or crashed runs collide ("Destination file path ... already
          # exists"). RUNNER_TEMP is per-runner and cleaned after each job.
          TMPDIR: ${{ runner.temp }}
