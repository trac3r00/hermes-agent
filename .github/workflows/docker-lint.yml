name: Docker / shell lint

# Lints the container build inputs: Dockerfile (via hadolint) and any shell
# scripts under docker/ (via shellcheck). These catch the class of regression
# the behavioral docker smoke test can't — unquoted variable
# expansions, silently-failing RUN commands, etc.
#
# Rules and ignores are documented in .hadolint.yaml at the repo root.
# shellcheck severity is pinned to `error` so SC1091-style "can't follow
# sourced script" info-level warnings don't fail the job — the .venv
# activate script doesn't exist at lint time.

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: docker-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hadolint:
    name: Lint Dockerfile (hadolint)
    runs-on: [self-hosted, linux, x64, pve-ci]
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # hadolint-action is a Docker container action and the self-hosted
      # runners have no Docker; run the same hadolint release (v2.12.0, the
      # version the action's image pins) as a checksum-verified binary.
      - name: hadolint
        run: |
          set -euo pipefail
          HADOLINT_VERSION=v2.12.0
          HADOLINT_SHA256=56de6d5e5ec427e17b74fa48d51271c7fc0d61244bf5c90e828aab8362d55010
          HADOLINT_BIN="${RUNNER_TEMP}/hadolint"
          curl -sSfL --retry 3 --retry-delay 5 -o "$HADOLINT_BIN" \
            "https://github.com/hadolint/hadolint/releases/download/${HADOLINT_VERSION}/hadolint-Linux-x86_64"
          echo "${HADOLINT_SHA256}  ${HADOLINT_BIN}" | sha256sum -c -
          chmod +x "$HADOLINT_BIN"
          "$HADOLINT_BIN" --config .hadolint.yaml --failure-threshold warning Dockerfile

  shellcheck:
    name: Lint docker/ shell scripts (shellcheck)
    runs-on: [self-hosted, linux, x64, pve-ci]
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: shellcheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # v2.0.0
        env:
          # Severity = error: SC1091 (can't follow sourced script) is info-
          # level and would otherwise fail when the venv activate script
          # doesn't exist at lint time.
          SHELLCHECK_OPTS: --severity=error
        with:
          scandir: ./docker
