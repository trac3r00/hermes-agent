name: QA (self-hosted PVE)

# Repo convention: individual workflows do not declare their own push /
# pull_request triggers. The ci.yml orchestrator invokes them via
# workflow_call. workflow_dispatch is kept for manual verification runs.
on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    name: Tests and static checks
    runs-on: [self-hosted, pve, vm101]
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python environment
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -q --upgrade pip
          # Test collection needs the messaging (aiohttp.test_utils) and acp extras.
          .venv/bin/python -m pip install -q -e '.[dev,messaging,acp]' || .venv/bin/python -m pip install -q -e '.[dev]'

      - name: Syntax check
        run: .venv/bin/python -m compileall -q hermes_cli agent tools

      - name: Lint (ruff)
        continue-on-error: true
        run: |
          .venv/bin/python -m pip install -q ruff
          .venv/bin/ruff check . --output-format=github

      - name: Unit tests (pytest)
        run: |
          set -o pipefail
          .venv/bin/python -m pip install -q pytest pytest-timeout
          .venv/bin/python -m pytest -q --timeout=120 2>&1 | tail -60
